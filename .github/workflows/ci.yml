name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, Firebase emulators)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test

  plugin-version:
    name: Plugin version bumped when plugin files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Installed plugins only update when the version in .claude-plugin/plugin.json changes.
      - run: node scripts/check-plugin-version.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://claude-chatroom-lf.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keyless: GitHub's OIDC token is exchanged for a short-lived Google credential.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Render security rules with the access list
        run: node scripts/build-rules.mjs
        env:
          CHATROOM_ALLOWED_EMAILS: ${{ secrets.CHATROOM_ALLOWED_EMAILS }}
          CHATROOM_ALLOWED_DOMAINS: ${{ secrets.CHATROOM_ALLOWED_DOMAINS }}
      - name: Deploy rules, indexes and web app
        run: npx firebase deploy --only firestore,hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
